<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu pizza YA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">🍕 Delizia</div>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#menu">Menú</a></li>
                <li><a href="#promociones">Promociones</a></li>
                <li><a href="#opiniones">Opiniones</a></li>
                <li><a href="#reservas">Reservas</a></li>
                </ul>
        </nav>
    </header>
    <!-- hero section -->
    <section id="inicio" class="hero">
        <h1>Bienvenido a Delizia</h1>
        <p>La mejor pizza de la ciudad, hecha con ingredientes frescos y amor.</p>
        <a href="#menu" class="btn">Ver Menú</a>

    <!-- menu section -->
    <section id="menu" class="menu">
        <h2>Nuestro Menú</h2>
        <div class="menu-grid">
            <div class="item">Pizza Hawaiana</div>

            <div class="item">Pizza Vegetariana</div>
        </div>

    <!-- Promociones -->
    <section id="promos" class="promos">
        <h2>Promociones Especiales</h2>
        <p>Martes 2x1 en pizzas medianas 🍕</p>
    </section>
